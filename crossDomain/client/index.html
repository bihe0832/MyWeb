<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html lang="zh-CN">
<head>
<meta name="zixie-type" content="common" />
<meta name="zixie-ignore" content="color-token,glass-gradient,font-title" />
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>Cross Domain Test</title>
    <link rel="canonical" href="https://microdemo.bihe0832.com/crossDomain/client/index.html" />
</head>
<body>
<a href="javascript:history.go(-1)">返回</a>
cross domain By JSONP
<BR />
<a href="javascript:CorssDomain.ajax();" id="test1">get JSONP Data by JQuery ajax:</a>
<div>
	data:
	<span id="test1data"></span>
</div>
<a href="javascript:CorssDomain.getjson();" id="test2">get JSONP Data by JQuery getjson</a>
<div>
	data:
	<span id="test2data"></span>
</div>
<a href="javascript:CorssDomain.get();" id="test3">get JSONP Data by JQuery get</a>
<div>
	data:
	<span id="test3data"></span>
</div>
<HR>
cross domain By Server
<BR />
<a href="javascript:CorssDomain.byServer();" id="test4">get JSON Data by JQuery ajax:</a>
<div>
	data:
	<span id="test4data"></span>
</div>

  
<script src="https://cdn.bihe0832.com/js/pikachu-stats.js?v=4fe2787c" defer></script>
  <script type="text/javascript" src="./jquery.min.js?v=fc184f96"></script>
  <script type="text/javascript">
//所有Ajax请求的URL
var postUrl = "https://microdemotest.bihe0832.com/crossDomain/";
var CorssDomain = {};
CorssDomain.ajax = function(){
	$.ajax({  
		type: "get",  
		url: postUrl + "jsonp.php",  
		dataType:"jsonp",
		async: false,
		data: {rd:Math.random()},
		jsonp: 'callback',
		success: function(result) { 
			 var html=""
			 for(var i in result) html+= i +":" +result[i] +";"; 
			 $("#test1data").html(html);
		},
		error: function(err) {  
			showAlert("fail");
		} 
	}); 
}

CorssDomain.getjson =function() {
	$.getJSON(postUrl + "jsonp.php?callback=?", 
		{rd: Math.random()}, 
		function(result) {   
			 var html=""
			 for(var i in result) html+= i +":" +result[i] +";"; 
			 $("#test2data").html(html);
    });   
}

CorssDomain.get =function() {
	 $.get(postUrl + "jsonp.php?callback=?", 
			 {rd: Math.random()}, 
			 function (result) { 
				 var html=""
				 for(var i in result) html+= i +":" +result[i] +";"; 
				 $("#test3data").html(html);
				 
			},
			'jsonp'
		);  
}

CorssDomain.byServer = function(){
	$.ajax({  
		type: "get",  
		url: postUrl + "crossdomain.php",  
		dataType:"json",
		async: false,
		data: {rd:Math.random()},
		success: function(result) { 
			 var html=""
			 for(var i in result) html+= i +":" +result[i] +";"; 
			 $("#test4data").html(html);
		},
		error: function(err) {  
			showAlert("fail");
		} 
	}); 
}
</script>
<script>
function showAlert(msg) {
  var d = document.createElement('div');
  d.textContent = msg;
  d.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);color:#fff;padding:12px 20px;border-radius:8px;z-index:9999;font-size:14px;';
  document.body.appendChild(d);
  setTimeout(function(){ d.remove(); }, 2000);
}
</script>
</body>
</html>
